[package]
name = "hum-tui"
version = "0.1.2"
edition = "2024"
repository = "https://github.com/shurizzle/hum"
license = "MIT"

# Prebuilt binaries from .github/workflows/release.yml (`hum-<target>.tar.gz` on `vX.Y.Z` releases).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/hum-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "hum{ binary-ext }"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
clap_complete = "4.6.12"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7.0.0"
env_logger = "0.11.11"
futures-util = { version = "0.3.34", features = ["sink"] }
heed = { version = "0.22", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-oauth = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-protocol = "0.8"
log = "0.4.35"
oauth2 = { version = "5", default-features = false }
open = "5"
protobuf = "3.7.2"
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "tokio"] }
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2", "charset", "rustls-tls-webpki-roots"] }
# DPoP ES256 for Soloist pairing (token-exchange); ring is already the sole crypto backend.
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
# Soloist runtime: loopback ws:// to its WebSocket API (plain TCP handshake, no TLS).
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
ron = "0.12"

[features]
default = ["ecs"]
# Spotify Web Playback SDK in castLabs Electron as a playback engine (off: Soloist only).
ecs = []

[[bin]]
name = "hum"
path = "src/main.rs"

# Image decoding/encoding is unusably slow unoptimized; keep our own crate debuggable.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1

[target.'cfg(target_os = "linux")'.dependencies]
# MPRIS for the Soloist engine (src/media/mpris.rs); pure Rust D-Bus, so musl builds stay static.
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Now Playing for the Soloist engine (src/media/now_playing.rs).
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSGeometry", "NSObjCRuntime", "NSObject", "NSPort", "NSRunLoop", "NSString", "NSValue"] }
objc2-media-player = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }
