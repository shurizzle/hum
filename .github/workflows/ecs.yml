# Publishes castLabs Electron for Content Security, renamed to hum and VMP-signed, for macOS.
# Run by hand: it does nothing when the newest castLabs release is already published here, unless
# `force` (re-sign, e.g. before the signature expires). Releases are tagged `ecs-<castLabs tag>`,
# apart from hum's own `vX.Y.Z` releases, and never marked latest. See docs/playback.md.
name: Signed Electron

on:
  workflow_dispatch:
    inputs:
      force:
        description: Re-sign and re-upload even if the release exists
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
      exists: ${{ steps.latest.outputs.exists }}
    steps:
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/castlabs/electron-releases/releases \
            --jq '[.[] | select(.prerelease | not) | select(.tag_name | endswith("+wvcus")) | .tag_name][0]')
          [ -n "$tag" ] || { echo "no castLabs release found"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "ecs-$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ecs-$tag already published"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  sign:
    needs: check
    if: needs.check.outputs.exists == 'false' || inputs.force
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: arm64
            asset: aarch64
          - arch: x64
            asset: x86_64
    env:
      TAG: ${{ needs.check.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download
        run: gh release download "$TAG" -R castlabs/electron-releases -p "electron-$TAG-darwin-${{ matrix.arch }}.zip"
      - name: Extract and rename
        run: |
          mkdir ecs
          # ditto keeps the framework symlinks a plain unzip may break.
          ditto -x -k "electron-$TAG-darwin-${{ matrix.arch }}.zip" ecs
          # Name shown in macOS Now Playing / Control Center.
          /usr/libexec/PlistBuddy -c "Set :CFBundleName hum" -c "Set :CFBundleDisplayName hum" \
            -c "Set :CFBundleIdentifier dev.hum.player" ecs/Electron.app/Contents/Info.plist
          xattr -cr ecs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: VMP sign
        env:
          EVS_ACCOUNT: ${{ secrets.EVS_ACCOUNT }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          pip install castlabs-evs
          python -m castlabs_evs.vmp -n sign-pkg --streaming -A "$EVS_ACCOUNT" -P "$EVS_PASSWD" ecs
          python -m castlabs_evs.vmp -n verify-pkg ecs
      - name: Pack
        run: ditto -c -k --keepParent ecs/Electron.app "hum-ecs-macos-${{ matrix.asset }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: hum-ecs-macos-${{ matrix.asset }}
          path: hum-ecs-macos-${{ matrix.asset }}.zip

  publish:
    needs: [check, sign]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.check.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Release
        run: |
          if gh release view "ecs-$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "ecs-$TAG" -R "$GITHUB_REPOSITORY" --clobber hum-ecs-macos-*.zip
          else
            gh release create "ecs-$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "Electron $TAG (VMP-signed)" \
              --notes "castLabs Electron for Content Security $TAG, renamed to hum and VMP-signed. Extract into ~/Library/Application Support/hum/ecs/ (see docs/playback.md)." \
              hum-ecs-macos-*.zip
          fi
